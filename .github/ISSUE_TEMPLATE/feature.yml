name: Feature request
description: Propose a scoped capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private document content, personal data, or live identifiers.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem needs to be solved, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result.
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: User story
      placeholder: As a …, I want …, so that …
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work included in this issue.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: List adjacent work deliberately excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide a testable checklist.
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Cover authentication, authorization, secrets, document data, logs, and abuse cases.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: Identify unit, integration, protocol, and container checks as applicable.
    validations:
      required: true
  - type: textarea
    id: deployment
    attributes:
      label: Deployment impact
      description: Note configuration, migration, downtime, resource, or proxy changes.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues, systems, or decisions; write None when absent.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback considerations
      description: Explain how the change can be disabled or reverted safely.
    validations:
      required: true
