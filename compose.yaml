services:
  paperless-assistant:
    container_name: PaperlessAssistant
    image: paperless-assistant:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/New_York}
      ALLOW_EDIT_TITLE: ${ALLOW_EDIT_TITLE:-true}
      ALLOW_EDIT_DATE: ${ALLOW_EDIT_DATE:-true}
      ALLOW_EDIT_CORRESPONDENT: ${ALLOW_EDIT_CORRESPONDENT:-true}
      ALLOW_EDIT_DOCUMENT_TYPE: ${ALLOW_EDIT_DOCUMENT_TYPE:-true}
      ALLOW_EDIT_STORAGE_PATH: ${ALLOW_EDIT_STORAGE_PATH:-true}
      ALLOW_EDIT_TAGS: ${ALLOW_EDIT_TAGS:-true}
      REQUIRE_NEW_METADATA_CONFIRMATION: ${REQUIRE_NEW_METADATA_CONFIRMATION:-true}
    volumes:
      - paperless-assistant-data:/data
    ports:
      - "127.0.0.1:8780:8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          response=urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3);
          payload=json.load(response);
          assert response.status==200 and payload.get('status')=='ok'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  paperless-assistant-data:
    name: paperless-assistant-data
