[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[project]
name = "paperless-assistant"
version = "0.1.0"
description = "A secure, self-hosted document assistant beginning with an MCP connectivity probe."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "Joe Cole" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.28.1,<2",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.51.0,<1",
]

[project.scripts]
paperless-assistant = "paperless_assistant.app:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=2.3.0,<3",
  "pip-audit>=2.10.0,<3",
  "pre-commit>=4.5.1,<5",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.15.22,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_assistant"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "DTZ", "E", "F", "I", "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RUF", "S", "SIM", "T20", "UP"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts/mcp_smoke_test.py"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--capture=sys --strict-config --strict-markers --cov=paperless_assistant --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["paperless_assistant"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
]
